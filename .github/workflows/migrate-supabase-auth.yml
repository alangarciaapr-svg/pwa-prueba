name: Finalize Supabase Auth patch

on:
  push:
    paths:
      - '.github/workflows/migrate-supabase-auth.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove final legacy session restore
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="if(localStorage.getItem('iaptidud-dark')==='1'){document.body.classList.add('dark');document.getElementById('darkSwitch').classList.add('on')}\ntry{currentUser=JSON.parse(localStorage.getItem('iaptidud-current-user')||'null')}catch(e){}\ndata.forEach(x=>{"
          new="if(localStorage.getItem('iaptidud-dark')==='1'){document.body.classList.add('dark');document.getElementById('darkSwitch').classList.add('on')}\ncurrentUser=null;\ndata.forEach(x=>{"
          if old not in s:
              raise SystemExit('No se encontró restauración legacy final')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit final auth patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Eliminar restauración de sesión demo"
          git push origin main
