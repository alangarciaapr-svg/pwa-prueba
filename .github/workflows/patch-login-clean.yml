name: Patch login clean

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-login:
    if: ${{ !contains(github.event.head_commit.message || '', '[login-clean-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Limpiar campos de login
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              '<input id="loginEmail" value="admin@admin.cl" autocomplete="username">',
              '<input id="loginEmail" value="" autocomplete="off" autocapitalize="none" spellcheck="false">',
              1
          )
          s = s.replace(
              '<input id="loginPass" value="1234" type="password" autocomplete="current-password">',
              '<input id="loginPass" value="" type="password" autocomplete="new-password">',
              1
          )

          old = """function login(){
           const e=document.getElementById('loginEmail').value.trim().toLowerCase(),p=document.getElementById('loginPass').value;
           const found=users.find(u=>u.email===e&&u.password===p);
           if(found){"""

          new = """function login(){
           const emailInput=document.getElementById('loginEmail');
           const passInput=document.getElementById('loginPass');
           const e=emailInput.value.trim().toLowerCase(),p=passInput.value;
           // Limpiar inmediatamente los datos ingresados para que no queden visibles en el login.
           emailInput.value='';
           passInput.value='';
           const found=users.find(u=>u.email===e&&u.password===p);
           if(found){"""

          if old not in s:
              raise SystemExit('No se encontró el bloque esperado de login; no se modificó el archivo.')

          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Guardar cambio
        shell: bash
        run: |
          git config user.name "ChatGPT GitHub Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar"
            exit 0
          fi
          git commit -m "[login-clean-patch] Limpiar campos de login"
          git push
