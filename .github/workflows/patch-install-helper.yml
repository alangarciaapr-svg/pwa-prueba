name: Patch install helper

on:
  push:
    paths:
      - '.github/workflows/patch-install-helper.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert install helper directly in index and bump cache
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          marker = '<link rel="manifest" href="./manifest.json">\n'
          script = '<script src="./install-helper.js"></script>\n'
          if script not in text:
              if marker not in text:
                  raise SystemExit('Manifest marker not found in index.html')
              text = text.replace(marker, marker + script, 1)
              index.write_text(text, encoding='utf-8')

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8')
          sw_text = sw_text.replace("iaptidud-supervision-v10", "iaptidud-supervision-v11", 1)
          sw.write_text(sw_text, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Cargar instalador PWA directamente desde index"
          git push
