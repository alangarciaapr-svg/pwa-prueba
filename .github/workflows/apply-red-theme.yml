name: Aplicar paleta roja

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-red-theme.yml'

permissions:
  contents: write

jobs:
  apply-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Cambiar paleta azul por roja
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          replacements = {
              '#0057B8': '#C1121F',
              '#0a6ee8': '#E63946',
              '#00408a': '#8B0D17',
              '#083b78': '#7A0B14',
              '#0d74e9': '#D62828',
              '#60a5fa': '#E05A64',
              'rgba(59,130,246,.12)': 'rgba(193,18,31,.12)',
              'rgba(0,87,184,.32)': 'rgba(193,18,31,.32)',
              '#b9d6ff': '#F0B7BC',
              '#eaf3ff': '#FFF0F1',
              '#cfe2ff': '#F3C4C8',
              '#111d31': '#2A1114',
              '#23436c': '#5A2026',
              '#eef4ff': '#FFF0F1',
          }
          for old, new in replacements.items():
              html = html.replace(old, new)
          # La firma permanece azul (#1456C0) porque simula lápiz pasta azul.
          index.write_text(html, encoding='utf-8')

          manifest = Path('manifest.json')
          text = manifest.read_text(encoding='utf-8').replace('#0057B8', '#C1121F')
          manifest.write_text(text, encoding='utf-8')

          sw = Path('service-worker.js')
          if sw.exists():
              text = sw.read_text(encoding='utf-8')
              text = text.replace("iaptidud-supervision-v2", "iaptidud-supervision-v3")
              text = text.replace("iaptidud-supervision-v1", "iaptidud-supervision-v3")
              sw.write_text(text, encoding='utf-8')

      - name: Retirar flujo temporal
        run: rm -f .github/workflows/apply-red-theme.yml

      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.json service-worker.js .github/workflows/apply-red-theme.yml
          git commit -m "Aplicar paleta roja a Iaptidud supervision"
          git push
